<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星尘倒计时 · 粒子互动计时器</title>
  <style>
    :root {
      --bg-0: #edf2fa;
      --bg-1: #ffffff;
      --accent: #007aff;
      --accent-2: #5ac8fa;
      --text: #1d1d1f;
      --muted: rgba(29, 29, 31, 0.56);
      --glass: rgba(255, 255, 255, 0.38);
      --glass-strong: rgba(255, 255, 255, 0.46);
      --glass-border: rgba(255, 255, 255, 0.72);
      --glass-stroke: rgba(15, 23, 42, 0.07);
      --glass-hover: rgba(255, 255, 255, 0.62);
      --btn-bg: rgba(15, 23, 42, 0.055);
      --btn-hover: rgba(15, 23, 42, 0.1);
      --chip-active-bg: rgba(0, 122, 255, 0.12);
      --chip-active-text: #007aff;
      --primary-text: #ffffff;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --modal-backdrop: rgba(15, 23, 42, 0.1);
      --wheel-stage-bg: rgba(255, 255, 255, 0.22);
      --wheel-band-bg: rgba(255, 255, 255, 0.52);
      --wheel-band-border: rgba(255, 255, 255, 0.75);
      --wheel-input-bg: rgba(255, 255, 255, 0.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 44%, var(--bg-1) 0%, var(--bg-0) 80%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    /* Ultra-clean Apple HUD */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 22px;
      transition: opacity 0.35s ease;
    }

    .hud.zen-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .hud.zen-hidden * {
      pointer-events: none !important;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .glass-pill {
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 0 0 0.5px var(--glass-stroke);
      border-radius: 999px;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .title-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      cursor: text;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .title-chip:hover {
      background: var(--glass-hover);
    }

    .title-chip:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.16), var(--shadow);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .pulse-dot.running {
      animation: dotPulse 1.4s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.38); opacity: 0.45; }
    }

    .event-title-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      width: 120px;
      letter-spacing: 0.01em;
    }

    .event-title-input::placeholder {
      color: var(--muted);
    }

    .game-hud {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 12px;
      pointer-events: auto;
    }

    .stat-box {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .stat-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .combo-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--chip-active-bg);
      color: var(--accent);
      transition: transform 0.18s ease;
    }

    .combo-badge.pop {
      transform: scale(1.2);
    }

    .nova-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nova-bar {
      width: 52px;
      height: 5px;
      border-radius: 999px;
      background: var(--btn-bg);
      overflow: hidden;
    }

    .nova-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.25s ease;
    }

    .nova-btn {
      border: none;
      background: var(--btn-bg);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nova-btn.ready {
      background: var(--accent);
      color: var(--primary-text);
      box-shadow: 0 3px 12px rgba(0, 122, 255, 0.32);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow), inset 0 0 0 0.5px var(--glass-stroke);
    }

    .icon-btn:hover {
      background: var(--glass-hover);
      color: var(--text);
    }

    .icon-btn.active {
      color: var(--accent);
    }

    .center-banner {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.35s ease;
    }

    .status-tag {
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--muted);
      font-weight: 500;
    }

    .bottom-dock {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      width: 100%;
    }

    .drawer-popover {
      pointer-events: auto;
      background: var(--glass-strong);
      backdrop-filter: blur(32px) saturate(195%);
      -webkit-backdrop-filter: blur(32px) saturate(195%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 15px 18px;
      box-shadow: 0 20px 52px rgba(15, 23, 42, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      width: min(560px, calc(100vw - 24px));
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      position: absolute;
      bottom: 62px;
    }

    .drawer-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .drawer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .drawer-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      min-width: 58px;
    }

    .drawer-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .finale-inline-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--glass-stroke);
      border-radius: 12px;
      padding: 4px 6px 4px 11px;
    }

    .finale-text-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      min-width: 100px;
    }

    .finale-text-input::placeholder {
      color: var(--muted);
    }

    .mini-preview-btn {
      border: none;
      background: var(--chip-active-bg);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .mini-preview-btn:hover {
      background: var(--accent);
      color: var(--primary-text);
    }

    .dock-panel {
      pointer-events: auto;
      background: var(--glass);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 0 0 0.5px var(--glass-stroke);
      border-radius: 999px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .btn {
      border: none;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--primary-text);
      font-weight: 600;
      padding: 8px 18px;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.28);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
      background: var(--accent);
      color: var(--primary-text);
    }

    .btn-glass-accent {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      padding: 8px 22px;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .btn-glass-accent:hover {
      filter: brightness(1.06);
      background: var(--accent);
      color: #ffffff;
    }

    .btn-chip {
      padding: 5px 11px;
      font-size: 12px;
      background: var(--btn-bg);
      color: var(--muted);
    }

    .btn-chip:hover {
      color: var(--text);
    }

    .btn-chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      font-weight: 600;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--glass-stroke);
      margin: 0 2px;
    }

    .swatch-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .swatch:hover {
      transform: scale(1.14);
    }

    .swatch.active {
      transform: scale(1.16);
      box-shadow: 0 0 0 2px var(--accent), 0 3px 10px rgba(15, 23, 42, 0.18);
    }

    .style-chip {
      padding: 5px 11px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--btn-bg);
      color: var(--muted);
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .style-chip:hover {
      color: var(--text);
      background: var(--btn-hover);
    }

    .style-chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      font-weight: 600;
    }

    .style-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }



    /* Apple Frosted Glass Time Picker Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: var(--modal-backdrop);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 348px;
      background: var(--glass-strong);
      backdrop-filter: blur(34px) saturate(200%);
      -webkit-backdrop-filter: blur(34px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 20px 22px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.55);
      transform: translateY(10px) scale(0.97);
      transition: transform 0.22s ease;
    }

    .modal-backdrop.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .wheel-labels-row {
      display: grid;
      grid-template-columns: 1fr 16px 1fr 16px 1fr;
      align-items: center;
      text-align: center;
      margin-bottom: 6px;
      padding: 0 8px;
    }

    .wheel-unit {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .wheel-stage {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 16px 1fr 16px 1fr;
      align-items: center;
      height: 180px;
      padding: 0 8px;
      margin-bottom: 12px;
      border-radius: 18px;
      background: var(--wheel-stage-bg);
      border: 1px solid var(--glass-stroke);
      overflow: hidden;
    }

    .wheel-highlight-band {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 72px;
      height: 36px;
      border-radius: 10px;
      background: var(--wheel-band-bg);
      border: 1px solid var(--wheel-band-border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      pointer-events: none;
      z-index: 1;
    }

    .wheel-drum {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
      cursor: ns-resize;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 2;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.45) 20%, black 42%, black 58%, rgba(0,0,0,0.45) 80%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.45) 20%, black 42%, black 58%, rgba(0,0,0,0.45) 80%, transparent 100%);
    }

    .wheel-drum.editing {
      -webkit-mask-image: none;
      mask-image: none;
    }

    /* Hide center item completely while typing so there is ZERO ghosting! */
    .wheel-drum.editing .wheel-item.pos-0 {
      opacity: 0;
      visibility: hidden;
    }

    .wheel-item {
      height: 36px;
      line-height: 36px;
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: color 0.12s ease, opacity 0.12s ease;
      cursor: pointer;
      flex-shrink: 0;
    }

    .wheel-item.pos-0 {
      font-size: 25px;
      font-weight: 600;
      color: var(--text);
      cursor: text;
    }

    .wheel-item.pos-1 {
      font-size: 18px;
      font-weight: 500;
      color: var(--muted);
      opacity: 0.78;
    }

    .wheel-item.pos-2 {
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      opacity: 0.36;
    }

    .wheel-colon {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 600;
      color: var(--muted);
      z-index: 2;
      padding-bottom: 2px;
    }

    .wheel-direct-input {
      position: absolute;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      width: 72px;
      height: 36px;
      line-height: 36px;
      text-align: center;
      background: var(--wheel-input-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      color: var(--text);
      font-size: 24px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      outline: none;
      z-index: 6;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.18);
      -moz-appearance: textfield;
    }

    .wheel-direct-input::-webkit-outer-spin-button,
    .wheel-direct-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .wheel-tip {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .zen-exit-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .zen-exit-btn.visible {
      opacity: 0.85;
      pointer-events: auto;
    }

    .zen-exit-btn.visible:hover {
      opacity: 1;
    }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 40;
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--glass-strong);
      backdrop-filter: blur(26px) saturate(185%);
      -webkit-backdrop-filter: blur(26px) saturate(185%);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 720px) {
      .hud {
        padding: 12px 12px;
      }
      .game-hud {
        display: none;
      }
      .dock-panel {
        border-radius: 20px;
        padding: 6px 8px;
      }
      .divider {
        display: none;
      }
      .drawer-popover {
        bottom: 92px;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="center-banner" id="centerBanner">
    <div class="status-tag" id="statusTag">专注冲刺 · 已就绪</div>
  </div>

  <div class="hud" id="hud">
    <header class="top-bar">
      <div class="brand-cluster">
        <label class="glass-pill title-chip" for="eventTitleInput" title="点击自定义倒计时名称">
          <span class="pulse-dot" id="pulseDot"></span>
          <input
            type="text"
            id="eventTitleInput"
            class="event-title-input"
            value="专注冲刺"
            maxlength="20"
            aria-label="自定义倒计时名称"
            placeholder="点击输入名称..."
          />
        </label>
      </div>

      <div class="glass-pill game-hud" title="捕获飘过的星辰碎片，积累星尘与超新星能量">
        <div class="stat-box">
          <span>星尘</span>
          <span class="stat-val" id="scoreVal">0</span>
        </div>
        <span class="combo-badge" id="comboBadge">x1</span>
        <div class="nova-wrap">
          <div class="nova-bar">
            <div class="nova-fill" id="novaFill"></div>
          </div>
          <button class="nova-btn" id="novaBtn" type="button" title="能量满 100% 时释放超新星粒子爆发">超新星</button>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn active" id="shardToggleBtn" type="button" title="开启/关闭星辰碎片" aria-label="星辰碎片开关">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </button>
        <button class="icon-btn active" id="soundToggleBtn" type="button" title="音效开关 (M)" aria-label="音效开关">
          <svg id="soundOnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">

  <script>
    (function () {
      'use strict';

      /* ---------------- Apple-Inspired Airy Light & Midnight Themes ---------------- */
      const COLOR_PRESETS = {
        sky:     { name: '晴空蓝', accent: '#007aff', accent2: '#54b2ff', palette: ['#0066e6', '#007aff', '#2693ff', '#54b2ff', '#7cc8ff'] },
        coral:   { name: '暖阳橙', accent: '#f06c00', accent2: '#ffa347', palette: ['#d95800', '#f06c00', '#ff851b', '#ffa347', '#ffc078'] },
        emerald: { name: '松翠绿', accent: '#059669', accent2: '#34d399', palette: ['#047857', '#059669', '#10b981', '#34d399', '#6ee7b7'] },
        rose:    { name: '樱雾粉', accent: '#db2777', accent2: '#f472b6', palette: ['#be185d', '#db2777', '#ec4899', '#f472b6', '#f9a8d4'] },
        iris:    { name: '星云紫', accent: '#6366f1', accent2: '#958cf8', palette: ['#4f46e5', '#6366f1', '#7c72f5', '#958cf8', '#b4aefb'] },
        amber:   { name: '香槟金', accent: '#b47f28', accent2: '#dfb256', palette: ['#926314', '#b47f28', '#cc993a', '#dfb256', '#ecc97c'] }
      };

      const THEMES = {
        cyber: {
          name: '苹果晴空',
          styleType: 'apple',
          isLight: true,
          bg0: '#e8eff9',
          bg1: '#fbfdff',
          fadeRgb: '238, 244, 252',
          accent: '#007aff',
          accent2: '#54b2ff',
          palette: ['#0066e6', '#007aff', '#2693ff', '#54b2ff', '#7cc8ff']
        },
        cosmos: {
          name: '午夜星岩',
          styleType: 'cosmos',
          isLight: false,
          bg0: '#0b111d',
          bg1: '#172338',
          fadeRgb: '13, 19, 31',
          accent: '#64d2ff',
          accent2: '#bae6fd',
          palette: ['#38bdf8', '#64d2ff', '#93e2ff', '#bae6fd', '#e0f2fe']
        }
      };

      /* ---------------- Clean Apple-Style Sound Engine ---------------- */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.master = null;
          this.delaySend = null;
          this.enabled = true;
        }

        unlock() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();

            const comp = this.ctx.createDynamicsCompressor();
            comp.threshold.value = -16;
            comp.ratio.value = 3;
            comp.connect(this.ctx.destination);

            this.master = this.ctx.createGain();
            this.master.gain.value = 0.85;
            this.master.connect(comp);

            const delay = this.ctx.createDelay(1.0);
            delay.delayTime.value = 0.22;
            const fb = this.ctx.createGain();
            fb.gain.value = 0.26;
            const lp = this.ctx.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.value = 2200;
            const wet = this.ctx.createGain();
            wet.gain.value = 0.24;

            this.delaySend = this.ctx.createGain();
            this.delaySend.gain.value = 1.0;
            this.delaySend.connect(delay);
            delay.connect(lp);
            lp.connect(fb);
            fb.connect(delay);
            lp.connect(wet);
            wet.connect(comp);
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        // Crisp subtle iOS mechanical micro-click
        playWheelClick() {
          if (!this.enabled) return;
          this.unlock();
          if (!this.ctx || !this.master) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1150, t);
          osc.frequency.exponentialRampToValueAtTime(320, t + 0.015);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(0.022, t + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.017);
          osc.connect(gain);
          gain.connect(this.master);
          osc.start(t);
          osc.stop(t + 0.02);
        }

        // Pure warm sine chime
        playBell(freq, startTime, duration = 0.6, volume = 0.065, sendEcho = 0.3) {
          if (!this.ctx || !this.master) return;
          const t = startTime;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);

          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(volume, t + 0.014);
          g.gain.exponentialRampToValueAtTime(0.0001, t + duration);

          osc.connect(g);
          g.connect(this.master);

          if (sendEcho > 0 && this.delaySend) {
            const send = this.ctx.createGain();
            send.gain.value = sendEcho;
            g.connect(send);
            send.connect(this.delaySend);
          }

          osc.start(t);
          osc.stop(t + duration + 0.04);
        }

        playTick(urgent = false, secLeft = 10) {
          if (!this.enabled) return;
          this.unlock();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          if (!urgent) {
            this.playBell(587.33, now, 0.2, 0.026, 0.18);
          } else {
            const scale = [523.25, 587.33, 659.25, 739.99, 783.99, 880.0, 987.77, 1046.5, 1174.66, 1318.5];
            const idx = Math.max(0, Math.min(scale.length - 1, 10 - secLeft));
            this.playBell(scale[idx], now, 0.5, 0.065, 0.4);
          }
        }

        playShockwave() {
          if (!this.enabled) return;
          this.unlock();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          this.playBell(523.25, now, 0.55, 0.032, 0.45);
          this.playBell(783.99, now + 0.04, 0.65, 0.024, 0.5);
        }

        playShardCatch(combo) {
          if (!this.enabled) return;
          this.unlock();
          if (!this.ctx) return;
          const lydian = [523.25, 587.33, 659.25, 739.99, 783.99, 880.0, 987.77, 1046.5, 1174.66, 1318.5];
          const base = lydian[Math.min(combo - 1, lydian.length - 1)];
          const now = this.ctx.currentTime;
          this.playBell(base, now, 0.75, 0.06, 0.5);
          this.playBell(base * 1.5, now + 0.055, 0.8, 0.034, 0.55);
        }

        playSupernova() {
          if (!this.enabled) return;
          this.unlock();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const chord = [261.63, 392.0, 493.88, 587.33, 783.99, 1046.5];
          chord.forEach((f, idx) => {
            this.playBell(f, now + idx * 0.045, 1.5, idx === 0 ? 0.062 : 0.048, 0.6);
          });
        }

        playCelebration() {
          if (!this.enabled) return;
          this.unlock();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 987.77, 1174.66, 1318.5, 1567.98];
          const now = this.ctx.currentTime;
          notes.forEach((freq, i) => {
            this.playBell(freq, now + i * 0.085, 1.4, 0.06, 0.65);
          });
        }
      }

      const sound = new SoundEngine();

      /* ---------------- DOM Refs ---------------- */
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });

      const novaBtn = document.getElementById('novaBtn');

      const soundToggleBtn = document.getElementById('soundToggleBtn');

      /* ---------------- App State ---------------- */
      const state = {
        width: window.innerWidth,
        height: window.innerHeight,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        themeKey: 'cyber',
        colorKey: 'default',
        mode: 'repulse',

        marqueeLoopLen: 0,

        marqueeSpeed: 110,
        lastTickSecond: 60,
        lastFrameTime: 0,
        zen: false,
        drawerOpen: false,
        shardsEnabled: true,
        score: 0,
        combo: 1,
        comboTimer: 0,

        celebrationTimer: 0,

        }

      /* ---------------- Tactile Particle Sprites (Light & Dark Optimized) ---------------- */
      const orbSpriteCache = new Map();

      function getOrbSprite(color, isLight, styleType = 'apple') {
        const cacheKey = `${color}_${isLight ? 'L' : 'D'}_${styleType}`;
        if (orbSpriteCache.has(cacheKey)) return orbSpriteCache.get(cacheKey);
        const size = 36;
        const half = size / 2;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const gctx = c.getContext('2d');

        if (styleType === 'monet') {
          // Soft impressionist painterly brushstroke dab (angled translucent oval)
          gctx.save();
          gctx.translate(half, half);
          gctx.rotate(-0.42);
          gctx.scale(1.38, 0.72);
          const grad = gctx.createRadialGradient(0, 0, 0, 0, 0, half * 0.78);
          grad.addColorStop(0, color + 'ee');
          grad.addColorStop(0.5, color + '99');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          gctx.fillStyle = grad;
          gctx.beginPath();
          gctx.arc(0, 0, half * 0.78, 0, Math.PI * 2);
          gctx.fill();
          gctx.restore();
        } else if (styleType === 'kyoto') {
          // Crisp faceted gold-leaf diamond fleck with subtle metallic highlight
          gctx.save();
          gctx.translate(half, half);
          gctx.rotate(Math.PI / 4);
          const s = half * 0.62;
          const grad = gctx.createLinearGradient(-s, -s, s, s);
          grad.addColorStop(0, '#fff7dc');
          grad.addColorStop(0.35, color);
          grad.addColorStop(1, color + 'cc');
          gctx.fillStyle = grad;
          gctx.fillRect(-s * 0.58, -s * 0.58, s * 1.16, s * 1.16);
          gctx.restore();
        } else if (isLight) {
          // Clean Apple circular glass bead
          const grad = gctx.createRadialGradient(half, half, 0, half, half, half);
          grad.addColorStop(0, color);
          grad.addColorStop(0.42, color + 'dd');
          grad.addColorStop(0.7, color + '44');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          gctx.fillStyle = grad;
          gctx.fillRect(0, 0, size, size);
        } else {
          // Luminous deep-space starlight sphere
          const grad = gctx.createRadialGradient(half, half, 0, half, half, half);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.28, color);
          grad.addColorStop(0.58, color + '77');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          gctx.fillStyle = grad;
          gctx.fillRect(0, 0, size, size);
        }

        orbSpriteCache.set(cacheKey, c);
        return c;
      }

      /* ---------------- Particle Entities ---------------- */
      const textParticles = [];
      const burstParticles = [];
      const bgDust = [];
      const shockwaves = [];
      const shards = [];
      const floatingTexts = [];

      const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

      let toastTimer = null;
      let previewTimer = null;

      /* ---------------- Utilities ---------------- */

        toastEl.textContent = msg;
        toastEl.classList.add('show');

        toastTimer = setTimeout(() => {
