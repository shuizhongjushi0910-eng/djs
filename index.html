<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星尘倒计时 · 粒子互动计时器</title>
  <style>
    :root {
      --bg-0: #0c1118;
      --bg-1: #16202e;
      --accent: #67e8f9;
      --accent-2: #60a5fa;
      --text: #f1f5f9;
      --muted: rgba(203, 213, 225, 0.65);
      --glass: rgba(15, 23, 36, 0.54);
      --glass-strong: rgba(15, 23, 36, 0.88);
      --glass-border: rgba(255, 255, 255, 0.11);
      --glass-hover: rgba(255, 255, 255, 0.14);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, var(--bg-1) 0%, var(--bg-0) 76%);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 54%, rgba(6, 10, 16, 0.35) 100%);
      z-index: 2;
    }

    /* Ultra-clean HUD */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 22px;
      transition: opacity 0.35s ease;
    }

    .hud.zen-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .hud.zen-hidden * {
      pointer-events: none !important;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .glass-pill {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .title-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      flex-shrink: 0;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .pulse-dot.running {
      animation: dotPulse 1.4s infinite ease-in-out;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .event-title-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      width: 96px;
      letter-spacing: 0.04em;
    }

    .event-title-input::placeholder {
      color: var(--muted);
    }

    .game-hud {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 12px;
      pointer-events: auto;
    }

    .stat-box {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .stat-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .combo-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent);
      transition: transform 0.18s ease, background 0.2s ease;
    }

    .combo-badge.pop {
      transform: scale(1.22);
      background: rgba(255, 255, 255, 0.2);
    }

    .nova-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nova-bar {
      width: 52px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .nova-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.25s ease;
    }

    .nova-btn {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nova-btn.ready {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0c1118;
      border-color: transparent;
      box-shadow: 0 0 14px var(--accent);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: rgba(241, 245, 249, 0.82);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .icon-btn:hover {
      background: var(--glass-hover);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .icon-btn.active {
      border-color: rgba(255, 255, 255, 0.24);
      color: var(--accent);
    }

    .center-banner {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.35s ease;
    }

    .status-tag {
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.78;
      font-weight: 500;
    }

    .bottom-dock {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      width: 100%;
    }

    .drawer-popover {
      pointer-events: auto;
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 14px 16px;
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.45);
      width: min(560px, calc(100vw - 24px));
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      position: absolute;
      bottom: 62px;
    }

    .drawer-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .drawer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .drawer-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      min-width: 56px;
    }

    .drawer-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .finale-inline-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 4px 6px 4px 11px;
    }

    .finale-text-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      min-width: 100px;
    }

    .finale-text-input::placeholder {
      color: var(--muted);
    }

    .mini-preview-btn {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.09);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .mini-preview-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent);
    }

    .dock-panel {
      pointer-events: auto;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .btn {
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.07);
      color: rgba(241, 245, 249, 0.92);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b111a;
      font-weight: 700;
      padding: 8px 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b111a;
    }

    .btn-chip {
      padding: 5px 10px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .btn-chip:hover {
      color: var(--text);
    }

    .btn-chip.active {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.26);
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    .swatch-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.22);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .swatch:hover {
      transform: scale(1.14);
    }

    .swatch.active {
      border-color: #ffffff;
      transform: scale(1.16);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
    }

    /* Custom Time Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(8, 12, 18, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      background: var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      transform: translateY(10px) scale(0.97);
      transition: transform 0.22s ease;
    }

    .modal-backdrop.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
    }

    .wheel-picker-wrap {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 4px;
      margin: 6px 0 14px;
      padding: 8px 6px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .wheel-highlight-band {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 50%;
      height: 44px;
      transform: translateY(-50%);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      pointer-events: none;
    }

    .wheel-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      z-index: 2;
    }

    .wheel-unit {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .wheel-drum {
      position: relative;
      width: 100%;
      height: 176px;
      overflow: hidden;
      cursor: ns-resize;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 26%, black 74%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 26%, black 74%, transparent 100%);
    }

    .wheel-item {
      height: 36px;
      line-height: 36px;
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: transform 0.12s ease, opacity 0.12s ease, color 0.12s ease;
      cursor: pointer;
    }

    .wheel-item.pos-0 {
      height: 44px;
      line-height: 44px;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(103, 232, 249, 0.35);
    }

    .wheel-item.pos-1 {
      font-size: 19px;
      font-weight: 500;
      color: rgba(226, 232, 240, 0.55);
    }

    .wheel-item.pos-2 {
      font-size: 14px;
      font-weight: 400;
      color: rgba(226, 232, 240, 0.24);
    }

    .wheel-colon {
      font-size: 22px;
      font-weight: 700;
      color: rgba(226, 232, 240, 0.45);
      padding-top: 18px;
      z-index: 2;
    }

    .wheel-direct-input {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 40px;
      text-align: center;
      background: rgba(12, 18, 30, 0.96);
      border: 1px solid var(--accent);
      border-radius: 10px;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      outline: none;
      z-index: 5;
      box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.18);
      -moz-appearance: textfield;
    }

    .wheel-direct-input::-webkit-outer-spin-button,
    .wheel-direct-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .wheel-tip {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .zen-exit-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .zen-exit-btn.visible {
      opacity: 0.78;
      pointer-events: auto;
    }

    .zen-exit-btn.visible:hover {
      opacity: 1;
    }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 40;
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--glass-strong);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 720px) {
      .hud {
        padding: 12px 12px;
      }
      .game-hud {
        display: none;
      }
      .dock-panel {
        border-radius: 20px;
        padding: 6px 8px;
      }
      .divider {
        display: none;
      }
      .drawer-popover {
        bottom: 92px;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="vignette"></div>

  <div class="center-banner" id="centerBanner">
    <div class="status-tag" id="statusTag">专注冲刺 · 已就绪</div>
  </div>

  <div class="hud" id="hud">
    <header class="top-bar">
      <div class="brand-cluster">
        <div class="glass-pill title-chip">
          <span class="pulse-dot" id="pulseDot"></span>
          <input
            type="text"
            id="eventTitleInput"
            class="event-title-input"
            value="专注冲刺"
            maxlength="14"
            aria-label="倒计时主题名称"
            placeholder="输入主题..."
          />
        </div>
      </div>

      <div class="glass-pill game-hud" title="捕获飘过的星辰碎片，积累星尘与超新星能量">
        <div class="stat-box">
          <span>星尘</span>
          <span class="stat-val" id="scoreVal">0</span>
        </div>
        <span class="combo-badge" id="comboBadge">x1</span>
        <div class="nova-wrap">
          <div class="nova-bar">
            <div class="nova-fill" id="novaFill"></div>
          </div>
          <button class="nova-btn" id="novaBtn" type="button" title="能量满 100% 时释放超新星粒子爆发">超新星</button>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn active" id="shardToggleBtn" type="button" title="开启/关闭星辰碎片" aria-label="星辰碎片开关">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </button>
        <button class="icon-btn active" id="soundToggleBtn" type="button" title="音效开关 (M)" aria-label="音效开关">
          <svg id="soundOnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="soundOffIcon" style="display:none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <button class="icon-btn" id="zenToggleBtn" type="button" title="纯净沉浸模式 (F)" aria-label="沉浸模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
      </div>
    </header>

    <footer class="bottom-dock">
      <div class="drawer-popover" id="customizeDrawer" aria-hidden="true">
        <div class="drawer-row">
          <span class="drawer-label">互动玩法</span>
          <div class="drawer-controls">
            <button class="btn btn-chip active" data-mode="repulse" type="button">斥力冲击</button>
            <button class="btn btn-chip" data-mode="vortex" type="button">引力黑洞</button>
            <button class="btn btn-chip" data-mode="bullet" type="button">子弹时间</button>
            <button class="btn btn-chip" data-mode="firework" type="button">星火烟花</button>
          </div>
        </div>

        <div class="drawer-row">
          <span class="drawer-label">主题色调</span>
          <div class="drawer-controls">
            <div class="swatch-group" id="themeSwatches" role="group" aria-label="配色主题">
              <button class="swatch active" data-theme="cyber" type="button" title="静谧深海" style="background: linear-gradient(135deg, #67e8f9, #60a5fa);"></button>
              <button class="swatch" data-theme="solar" type="button" title="暖茶琥珀" style="background: linear-gradient(135deg, #fbbf24, #fb923c);"></button>
              <button class="swatch" data-theme="aurora" type="button" title="松林青岚" style="background: linear-gradient(135deg, #5eead4, #34d399);"></button>

  <script>
    (function () {
      'use strict';

      /* ---------------- Clean, Serene, Non-Muddy Themes ---------------- */
      const THEMES = {
        cyber: {
          name: '静谧深海',
          bg0: '#0b1118',
          bg1: '#152232',
          fadeRgb: '12, 18, 27',
          accent: '#67e8f9',
          accent2: '#60a5fa',
          palette: ['#67e8f9', '#7dd3fc', '#60a5fa', '#bae6fd', '#f0f9ff']
